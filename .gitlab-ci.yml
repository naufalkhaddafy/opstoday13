stages:
  - build
  # - deploy

variables:
  # Base nama image di registry
  IMAGE_NAME: $CI_REGISTRY_IMAGE/opstoday13-app

build-docker-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # Login otomatis ke GitLab Container Registry menggunakan token CI bawaan
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Mulai mem-build Docker Image..."
    # 1. Build image dengan tag commit hash (selalu unik untuk pelacakan)
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA -f Dockerfile .
    
    # 2. Push tag commit hash
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    
    # 3. Handle Semantic Versioning Tags vs Branch Biasa
    - >
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Git Tag terdeteksi: $CI_COMMIT_TAG. Memberikan tag Semantic Versioning..."
        docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:$CI_COMMIT_TAG
        docker push $IMAGE_NAME:$CI_COMMIT_TAG
        
        echo "Mengupdate tag :latest agar menunjuk ke rilis terbaru ini..."
        docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest
      else
        echo "Bukan Git Tag. Mengupdate tag :latest untuk environment staging/development..."
        docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest
      fi
  rules:
    # Jalankan script ini kalau ada push ke branch main atau master
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    # ATAU jika ada push berupa Git Tag (contoh: v1.0.0)
    - if: $CI_COMMIT_TAG

