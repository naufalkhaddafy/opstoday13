services:
  init:
    image: registry.gitlab.com/naufalkhaddafy1/opstoday13/opstoday13-app:${APP_VERSION:-latest}
    restart: "no"
    command: [ "sh", "-c", "php artisan optimize:clear && php artisan optimize && php artisan migrate --force && php artisan db:seed --class=SettingSeeder --force && php artisan storage:link" ]
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - opstoday13

  app:
    image: registry.gitlab.com/naufalkhaddafy1/opstoday13/opstoday13-app:${APP_VERSION:-latest}
    restart: unless-stopped
    command: [ "sh", "-c", "php artisan optimize && exec frankenphp run --config /etc/caddy/Caddyfile" ]
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env.docker
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - opstoday13

  queue:
    image: registry.gitlab.com/naufalkhaddafy1/opstoday13/opstoday13-app:${APP_VERSION:-latest}
    restart: unless-stopped
    command: [ "sh", "-c", "php artisan optimize && exec php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600" ]
    env_file:
      - .env.docker
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - opstoday13

  scheduler:
    image: registry.gitlab.com/naufalkhaddafy1/opstoday13/opstoday13-app:${APP_VERSION:-latest}
    restart: unless-stopped
    command: [ "sh", "-c", "php artisan optimize && exec php artisan schedule:work" ]
    env_file:
      - .env.docker
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - opstoday13

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-opstoday13}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opstoday13

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}" ]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opstoday13

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 300M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - opstoday13

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - opstoday13

volumes:
  mysql_data:
  redis_data:
  app_storage:

networks:
  opstoday13:
    driver: bridge
